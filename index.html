<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#020617" />
  <title>Truck ID Check</title>

  <link rel="stylesheet" href="./styles.css" />

  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/ort.wasm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@7.0.0/dist/tesseract.min.js"></script>

  <script src="./config.js"></script>
  <script defer src="./app.js?v=30"></script>
</head>

<body>
  <main class="shell">
    <header class="header">
      <div>
        <div class="eyebrow">BD MEGA · TRUCK CHECK</div>
        <h1>Quét BKS</h1>
      </div>

      <div id="systemPill" class="pill pill-loading">
        <span class="dot"></span>
        <span id="systemText">Đang khởi động</span>
      </div>
    </header>

    <section class="scanner">
      <video id="video" autoplay playsinline muted></video>

      <div id="cameraFallback" class="camera-fallback hidden">
        <div class="camera-icon">📷</div>
        <div id="cameraFallbackText">Chạm để mở camera</div>
      </div>

      <div class="shade shade-top"></div>
      <div class="shade shade-bottom"></div>

      <div class="scan-frame">
        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>
        <div class="scan-line"></div>
        <span>ĐƯA BKS VÀO KHUNG</span>
      </div>
    </section>

    <section id="resultCard" class="result result-idle">
      <div id="resultMain" class="result-main">Đang chuẩn bị...</div>
      <div id="resultSub" class="result-sub">
        Camera và dữ liệu sẽ tự khởi động.
      </div>
    </section>

    <section class="manual-card">
      <div class="manual-title">Nhập BKS thủ công</div>

      <form id="manualForm" class="manual-form" autocomplete="off">
        <input
          id="manualInput"
          class="manual-input"
          type="text"
          inputmode="text"
          autocapitalize="characters"
          autocomplete="off"
          spellcheck="false"
          enterkeyhint="go"
          placeholder="VD: 50E-360.75"
          maxlength="16"
          aria-label="Nhập BKS thủ công"
        />

        <button id="manualBtn" class="manual-btn" type="submit">
          Kiểm tra
        </button>
      </form>

      <div class="manual-hint">
        Chỉ dùng khi OCR không đọc được hoặc cần sửa nhanh BKS.
      </div>
    </section>

    <section class="tiny-status">
      <span id="sourceStatus">Source: —</span>
      <span>·</span>
      <span id="logStatus">Log: —</span>
      <span>·</span>
      <span id="ocrStatus">OCR: —</span>
    </section>

    <canvas id="modelCanvas" width="128" height="64" hidden></canvas>
    <canvas id="bodyCanvas" width="960" height="480" hidden></canvas>
  </main>
</body>
</html>
